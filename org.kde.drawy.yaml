id: org.kde.drawy
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: drawy
rename-icon: drawy
rename-mime-file: application-x-drawy.xml
rename-mime-icons:
  - application-x-drawy
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland

cleanup:
  - /include
  - /share/doc
  - /share/qlogging-categories6

modules:
  - name: drawy
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DBUILD_TESTING=OFF
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://download.kde.org/stable/drawy/1.0.2/drawy-1.0.2.tar.xz
        sha256: 5ffaddefa967a6dad6f904c87ff85084c9013f5d1a0a0d87665759880d7c6d6f
        x-checker-data:
          type: anitya
          project-id: 387893
          stable-only: true
          url-template: https://download.kde.org/stable/drawy/$version/drawy-$version.tar.xz
